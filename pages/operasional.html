<div class="fade-in-up">
    <div id="progressArea"></div>
    <h2 class="section-title">Data Operasional</h2>

    <div class="card-modern">
        <div class="card-body-modern">
            <form id="formOperasional" onsubmit="return false">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Tanggal Mulai Usaha *</label>
                        <input type="date" class="form-control" name="tanggalMulai" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Jumlah Karyawan *</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="jumlahKaryawanStatus" value="tidak" required>
                            <label class="form-check-label">Tidak Ada</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="jumlahKaryawanStatus" value="ada" required>
                            <label class="form-check-label">Ada</label>
                        </div>
                    </div>
                    <div class="col-md-6" id="jumlahKaryawanWrap" style="display:none">
                        <label class="form-label">Jumlah Karyawan</label>
                        <input type="number" class="form-control" name="jumlahKaryawan" min="1">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Modal Usaha *</label>
                        <input type="number" class="form-control" name="modal" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Omzet *</label>
                        <input type="number" class="form-control" name="omzet" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Status Tempat Usaha *</label>
                        <div class="row g-2" id="statusTempatContainer">
                            <!-- Akan di-generate oleh JavaScript -->
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="d-flex justify-content-between mt-4">
        <button id="btnPrev" class="btn btn-outline-custom"><i class="bi bi-arrow-left"></i> Kembali</button>
        <button id="btnNext" class="btn btn-primary-custom">Selanjutnya <i class="bi bi-arrow-right"></i></button>
    </div>
</div>

<script>
// Generate pilihan Status Tempat
const statusList = ['Milik Sendiri','Sewa','Menumpang'];
const container = document.getElementById('statusTempatContainer');
container.innerHTML = statusList.map(s => `
    <div class="col-md-4">
        <div class="form-check">
            <input class="form-check-input" type="radio" name="statusTempat" value="${s}" required>
            <label class="form-check-label">${s}</label>
        </div>
    </div>
`).join('');

const toggleKaryawan = () => {
    const val = document.querySelector('[name="jumlahKaryawanStatus"]:checked')?.value;
    document.getElementById('jumlahKaryawanWrap').style.display = val === 'ada' ? 'block' : 'none';
};
document.querySelectorAll('[name="jumlahKaryawanStatus"]').forEach(r => r.addEventListener('change', toggleKaryawan));
toggleKaryawan();

document.getElementById('btnPrev').addEventListener('click', () => Router.go('data-usaha'));
document.getElementById('btnNext').addEventListener('click', () => {
    const fd = new FormData(document.getElementById('formOperasional'));
    FormManager.updateData(Object.fromEntries(fd.entries()));
    const v = FormManager.validateOperasional();
    if (!v.valid) { App.toast(v.msg, 'danger'); return; }
    Router.go('alamat-usaha');
});
</script>
