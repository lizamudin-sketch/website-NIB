<div class="fade-in-up">
    <div id="progressArea"></div>
    <h2 class="section-title">Data Usaha</h2>

    <div class="card-modern">
        <div class="card-body-modern">
            <form id="formDataUsaha" onsubmit="return false">
                <div class="mb-3">
                    <label class="form-label">Nama Usaha *</label>
                    <input type="text" class="form-control" name="namaUsaha" id="namaUsaha" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Jenis Usaha *</label>
                    <div class="row g-2" id="jenisUsahaContainer">
                        <!-- Di-generate oleh JavaScript di app.js -->
                    </div>
                </div>

                <div id="subFormWrap" class="mt-3 p-3 bg-light rounded"></div>
            </form>
        </div>
    </div>

    <div class="d-flex justify-content-between mt-4">
        <button id="btnPrev" class="btn btn-outline-custom"><i class="bi bi-arrow-left"></i> Kembali</button>
        <button id="btnNext" class="btn btn-primary-custom">Selanjutnya <i class="bi bi-arrow-right"></i></button>
    </div>
</div>
