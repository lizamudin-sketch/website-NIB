<div class="fade-in-up">
    <div id="progressArea"></div>
    <h2 class="section-title">Data Diri</h2>

    <div class="card-modern">
        <div class="card-body-modern">
            <form id="formDataDiri" onsubmit="return false">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nama Lengkap *</label>
                        <input type="text" class="form-control" name="nama" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">NIK *</label>
                        <input type="text" class="form-control" name="nik" maxlength="16" pattern="[0-9]{16}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Tempat Lahir *</label>
                        <input type="text" class="form-control" name="tempatLahir" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Tanggal Lahir *</label>
                        <input type="date" class="form-control" name="tanggalLahir" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Jenis Kelamin *</label>
                        <select class="form-select" name="jenisKelamin" required>
                            <option value="">Pilih...</option>
                            <option>Laki-laki</option>
                            <option>Perempuan</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nomor HP *</label>
                        <input type="tel" class="form-control" name="hp" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" id="email" readonly>
                    </div>
                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="emailToggle">
                            <label class="form-check-label" for="emailToggle">Saya memiliki Email Pribadi</label>
                        </div>
                    </div>
                    <div class="col-md-6" id="privateEmailWrap" style="display:none">
                        <label class="form-label">Email Pribadi</label>
                        <input type="email" class="form-control" name="emailPribadi">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Alamat Rumah *</label>
                        <textarea class="form-control" name="alamatRumah" rows="2" required></textarea>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="d-flex justify-content-end mt-4">
        <button id="btnNext" class="btn btn-primary-custom">Selanjutnya <i class="bi bi-arrow-right"></i></button>
    </div>
</div>
